networks:
  ecom_network:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:

services:

  # ─── Zookeeper (Kafka dependency) ───────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    networks:
      - ecom_network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    networks:
      - ecom_network
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    networks:
      - ecom_network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
      POSTGRES_DB: ecom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_user -d ecom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Producer ──────────────────────────────────────
  kafka-producer:
    build:
      context: ./kafka/producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    networks:
      - ecom_network
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ecom_transactions
      DATA_PATH: /app/data

  # ─── Kafka Consumer ──────────────────────────────────────
  kafka-consumer:
    build:
      context: ./kafka/consumer
      dockerfile: Dockerfile
    container_name: kafka-consumer
    networks:
      - ecom_network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ecom_transactions
      KAFKA_GROUP_ID: ecom_consumer_group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
      POSTGRES_DB: ecom_db

  # ─── Apache Spark ────────────────────────────────────────
  spark:
    image: apache/spark:3.5.0
    container_name: spark
    networks:
      - ecom_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPARK_MODE: master
    volumes:
      - ./spark/jobs:/opt/spark-jobs
    ports:
      - "8081:8080"

  # ─── Apache Airflow ──────────────────────────────────────
  airflow:
    image: apache/airflow:2.7.0
    container_name: airflow
    networks:
      - ecom_network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ecom_user:ecom_pass@postgres/ecom_db
      AIRFLOW__CORE__FERNET_KEY: 'CtVObWm6kf7XUrcv1xA3_j7dsmR6yqZFKBvq043GyV0='
      AIRFLOW__WEBSERVER__SECRET_KEY: 'CtVObWm6kf7XUrcv1xA3_j7dsmR6yqZFKBvq043GyV0='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
      POSTGRES_DB: ecom_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./spark/jobs:/opt/spark-jobs
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
               airflow webserver & airflow scheduler"
